[package]
name = "vtt-render"
description = "Прототип окна и карты: камера, сетка, токены, туман, линейка"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vtt_render"
path = "src/lib.rs"

[[bin]]
name = "vtt-play"
path = "src/main.rs"

[dependencies]
vtt-core = { path = "../vtt-core" }
vtt-server = { path = "../vtt-server" }
vtt-proto = { path = "../vtt-proto" }
vtt-net = { path = "../vtt-net" }
macroquad = "0.4"
rfd = "0.14"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde_json.workspace = true
anyhow.workspace = true
